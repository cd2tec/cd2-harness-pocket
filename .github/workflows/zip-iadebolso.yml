# ZIP da IA de Bolso para download fácil: a cada push no main, monta cd2tech-iadebolso.zip (pasta
# cd2tech-iadebolso, fins de linha do .gitattributes, sem testes nem specs) e troca o arquivo da
# release fixa "iadebolso". O link de download nunca muda. A release não vira "latest", para não
# disputar com as releases do cd2-ctl.
name: zip iadebolso
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zip-iadebolso
  cancel-in-progress: true
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar o ZIP
        run: |
          git archive --format=zip --prefix=cd2tech-iadebolso/ -o cd2tech-iadebolso.zip HEAD -- . ':!tests' ':!docs/superpowers' ':!.github'
          unzip -l cd2tech-iadebolso.zip | tail -1
      - name: Publicar na release iadebolso
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO="$(tr -d ' \r\n' < VERSION)"
          if ! gh release view iadebolso -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create iadebolso --latest=false --title "IA de Bolso" \
              --notes "Baixe cd2tech-iadebolso.zip, extraia, espete um pen drive de 16 GB e dê dois cliques em GRAVAR-PENDRIVE-Windows.bat. Passo a passo: https://cd2tec.github.io/cd2-ia-de-bolso/#pendrive" \
              -R "$GITHUB_REPOSITORY"
          fi
          gh release upload iadebolso cd2tech-iadebolso.zip --clobber -R "$GITHUB_REPOSITORY"
          gh release edit iadebolso --title "IA de Bolso $VERSAO" --latest=false -R "$GITHUB_REPOSITORY"
